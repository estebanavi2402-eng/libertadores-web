<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c140c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Escaramuza de las guerras de independencia: patriotas contra realistas.">
  <title>Libertadores — escaramuza</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div id="escenario">
    <canvas id="lienzo" width="800" height="400"></canvas>

    <header id="barra-superior">
      <div class="marca">
        <span class="marca-anio">1810</span>
        <span class="marca-nombre">Libertadores</span>
      </div>
      <div class="recursos">
        <span class="rec" title="Comida">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7" fill="#7dae3a"/><path d="M12 3c2 3 2 5 0 7-2-2-2-4 0-7z" fill="#d7ec9a"/><rect x="11" y="2" width="2" height="6" fill="#6b4428"/></svg>
          <span class="etiq">Comida</span>
          <strong id="val-comida">0</strong>
        </span>
        <span class="rec" title="Madera">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="4" fill="#8a5a32"/><circle cx="6" cy="12" r="3.2" fill="#c48a52"/><circle cx="6" cy="12" r="1.2" fill="#6b4428"/></svg>
          <span class="etiq">Madera</span>
          <strong id="val-madera">0</strong>
        </span>
        <span class="rec" title="Oro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="#e2b33a"/><circle cx="12" cy="12" r="5" fill="none" stroke="#8a6a16" stroke-width="1.6"/><path d="M12 8.5v7M9.2 10.2h4.4a2 2 0 0 1 0 3.2H10" fill="none" stroke="#8a6a16" stroke-width="1.4"/></svg>
          <span class="etiq">Oro</span>
          <strong id="val-oro">0</strong>
        </span>
        <span class="rec pob" aria-label="Población">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="2.3" fill="#f6edd8"/><circle cx="15.5" cy="9" r="2" fill="#e2b33a"/><path d="M4.5 18c.4-3 2.4-4.5 4.5-4.5S13 15 13.4 18" fill="#f6edd8"/><path d="M13 18c.3-2.4 1.7-3.6 3.4-3.6 1.6 0 2.8 1 3.2 3.6" fill="#e2b33a"/></svg>
          <span class="etiq">Población</span>
          <strong id="val-poblacion">0/0</strong>
        </span>
      </div>
    </header>

    <p id="pista">Tus aldeanos esperan orden.</p>
    <canvas id="minimapa" width="132" height="84" aria-label="Minimapa. Toca para mover la vista."></canvas>

    <footer id="barra-inferior">
      <div id="grupo-sistema">
        <button type="button" id="btn-todos" class="secundario">Seleccionar todos</button>
        <button type="button" id="btn-reiniciar" class="secundario">Reiniciar</button>
      </div>
      <div id="ficha">
        <strong id="ficha-nombre">Sin selección</strong>
        <span id="ficha-detalle">Toca una unidad o arrastra un recuadro.</span>
      </div>
      <div id="comandos"></div>
    </footer>

    <div id="aviso" role="status"></div>

    <div id="fin" hidden>
      <div class="tarjeta">
        <h2 id="fin-titulo">Victoria</h2>
        <p id="fin-texto"></p>
        <button type="button" id="btn-de-nuevo">Jugar de nuevo</button>
      </div>
    </div>

    <div id="giro">
      <div class="caja">
        <p>Gira el teléfono para jugar en horizontal.</p>
        <p class="sub">La escaramuza está pensada para el paisaje del llano: más ancho que alto.</p>
        <button type="button" id="btn-seguir">Jugar igual</button>
      </div>
    </div>
  </div>
  <noscript><p>Activa JavaScript para jugar la escaramuza.</p></noscript>
  <script src="js/juego.js"></script>
</body>
</html>
